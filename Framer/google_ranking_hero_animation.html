
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
  #stage {
    width: 100%;
    min-height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    font-family: Inter, system-ui, -apple-system, sans-serif;
  }
  #card {
    width: 100%;
    max-width: 580px;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 24px;
    padding: 24px;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #card.visible { opacity: 1; transform: translateY(0); }

  .search-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .g-logo { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; flex-shrink: 0; }
  .g-logo span:nth-child(1) { color: #4285F4; }
  .g-logo span:nth-child(2) { color: #EA4335; }
  .g-logo span:nth-child(3) { color: #FBBC05; }
  .g-logo span:nth-child(4) { color: #4285F4; }
  .g-logo span:nth-child(5) { color: #34A853; }
  .g-logo span:nth-child(6) { color: #EA4335; }

  .search-bar {
    flex: 1;
    height: 46px;
    border-radius: 999px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }
  .search-text {
    flex: 1;
    font-size: 15px;
    color: var(--color-text-primary);
    white-space: nowrap;
    overflow: hidden;
  }
  .cursor {
    width: 1.5px;
    height: 18px;
    background: var(--color-text-primary);
    flex-shrink: 0;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .cursor.hidden { display: none; }

  .search-icon { color: var(--color-text-secondary); flex-shrink: 0; }

  .search-btn {
    height: 46px;
    padding: 0 20px;
    border-radius: 999px;
    background: #4285F4;
    color: #fff;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    transform: scale(1);
    transition: transform 0.1s ease, background 0.2s ease;
    opacity: 0;
  }
  .search-btn.visible { opacity: 1; transition: opacity 0.3s ease, transform 0.1s ease; }
  .search-btn.pressed { transform: scale(0.93); background: #1a73e8; }

  /* Ripple loader */
  .loading-area {
    padding: 28px 12px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .loading-area.show { display: flex; }
  .shimmer {
    height: 10px;
    border-radius: 999px;
    background: var(--color-background-secondary);
    position: relative;
    overflow: hidden;
  }
  .shimmer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, var(--color-border-secondary) 50%, transparent 100%);
    animation: sweep 1.4s ease infinite;
  }
  @keyframes sweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

  /* Result card */
  #result {
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 20px;
    padding: 22px;
    display: none;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(20px) scale(0.97);
    background: var(--color-background-primary);
    margin-bottom: 4px;
  }
  #result.show {
    display: flex;
    animation: resultIn 0.65s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes resultIn {
    from { opacity:0; transform: translateY(20px) scale(0.97); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  .rank-badge {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #FEF9EC;
    border: 1px solid #F5D87A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    gap: 1px;
    opacity: 0;
    transform: scale(0.6) rotate(-15deg);
  }
  .rank-badge.pop {
    animation: badgePop 0.55s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
  }
  @keyframes badgePop {
    from { opacity:0; transform: scale(0.6) rotate(-15deg); }
    to   { opacity:1; transform: scale(1) rotate(0deg); }
  }
  .rank-num {
    font-size: 16px;
    font-weight: 700;
    color: #D8A847;
    line-height: 1;
  }

  .result-text { flex: 1; min-width: 0; }
  .result-name {
    font-size: 19px;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: 4px;
    opacity: 0;
    transform: translateX(-8px);
  }
  .result-name.slide { animation: slideIn 0.45s ease 0.25s forwards; }
  @keyframes slideIn {
    from { opacity:0; transform:translateX(-8px); }
    to   { opacity:1; transform:translateX(0); }
  }
  .result-url {
    font-size: 14px;
    color: #1a7f37;
    margin-bottom: 10px;
    opacity: 0;
    transform: translateX(-8px);
  }
  .result-url.slide { animation: slideIn 0.45s ease 0.35s forwards; }
  .result-stars {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--color-text-secondary);
    opacity: 0;
  }
  .result-stars.fade { animation: fadeUp 0.4s ease 0.45s forwards; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .stars { color: #D8A847; letter-spacing: 1px; font-size: 14px; }

  /* Lower results */
  #lower-results {
    padding: 16px 4px 4px;
    display: none;
    flex-direction: column;
    gap: 14px;
    opacity: 0;
  }
  #lower-results.show { display: flex; animation: fadeUp 0.5s ease 0.5s forwards; }
  .fake-row {
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 12px;
    align-items: center;
    opacity: 0.4;
  }
  .fake-num {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-tertiary);
  }
  .fake-lines { display: flex; flex-direction: column; gap: 6px; }

  /* Glow badge */
  .top-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #FEF9EC;
    border: 0.5px solid #F5D87A;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 500;
    color: #A07010;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.5s ease 2s forwards;
  }
</style>

<div id="stage">
  <div id="card">
    <div class="top-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#D8A847"/></svg>
      #1 Google ranking
    </div>

    <div class="search-row">
      <div class="g-logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
      </div>
      <div class="search-bar">
        <div class="search-text" id="search-text"></div>
        <div class="cursor" id="cursor"></div>
        <div class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </div>
      </div>
      <button class="search-btn" id="search-btn">Search</button>
    </div>

    <div class="loading-area" id="loading">
      <div class="shimmer" style="width:88%"></div>
      <div class="shimmer" style="width:72%"></div>
      <div class="shimmer" style="width:81%"></div>
      <div class="shimmer" style="width:65%"></div>
    </div>

    <div id="result">
      <div class="rank-badge" id="rank-badge">
        <svg width="18" height="15" viewBox="0 0 24 20" fill="none">
          <path d="M3 7.2 7.2 11 12 3l4.8 8L21 7.2 19.3 17H4.7L3 7.2Z" fill="#D8A847" opacity="0.9"/>
          <path d="M5 19h14" stroke="#D8A847" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="rank-num">1</div>
      </div>
      <div class="result-text">
        <div class="result-name" id="result-name">Glow Face Up</div>
        <div class="result-url" id="result-url">glowfaceup.com</div>
        <div class="result-stars" id="result-stars">
          <span class="stars">★★★★★</span>
          <span>(230 reviews)</span>
          <span>·</span>
          <span>Spa · Open now</span>
        </div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
          <div class="shimmer" style="width:85%;height:8px"></div>
          <div class="shimmer" style="width:65%;height:8px"></div>
        </div>
      </div>
    </div>

    <div id="lower-results">
      <div class="fake-row">
        <div class="fake-num">2</div>
        <div class="fake-lines">
          <div class="shimmer" style="width:60%;height:8px"></div>
          <div class="shimmer" style="width:80%;height:8px"></div>
          <div class="shimmer" style="width:55%;height:8px"></div>
        </div>
      </div>
      <div class="fake-row">
        <div class="fake-num">3</div>
        <div class="fake-lines">
          <div class="shimmer" style="width:70%;height:8px"></div>
          <div class="shimmer" style="width:50%;height:8px"></div>
          <div class="shimmer" style="width:75%;height:8px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const KEYWORD = "Facial near Dearborn";
const PHASES = {
  IDLE: 0,
  TYPING: 1,
  BTN_APPEAR: 2,
  SEARCHING: 3,
  RESULTS: 4,
  RESTART: 5
};

let phase = PHASES.IDLE;
let typedLen = 0;
let timers = [];

const card = document.getElementById('card');
const searchText = document.getElementById('search-text');
const cursor = document.getElementById('cursor');
const searchBtn = document.getElementById('search-btn');
const loading = document.getElementById('loading');
const result = document.getElementById('result');
const lowerResults = document.getElementById('lower-results');
const rankBadge = document.getElementById('rank-badge');
const resultName = document.getElementById('result-name');
const resultUrl = document.getElementById('result-url');
const resultStars = document.getElementById('result-stars');

function delay(fn, ms) {
  const t = setTimeout(fn, ms);
  timers.push(t);
  return t;
}

function reset() {
  timers.forEach(clearTimeout);
  timers = [];
  typedLen = 0;
  searchText.textContent = '';
  cursor.classList.remove('hidden');
  searchBtn.classList.remove('visible','pressed');
  loading.classList.remove('show');
  result.classList.remove('show');
  lowerResults.classList.remove('show');
  rankBadge.classList.remove('pop');
  resultName.classList.remove('slide');
  resultUrl.classList.remove('slide');
  resultStars.classList.remove('fade');
  phase = PHASES.TYPING;
  startTyping();
}

function startTyping() {
  if (typedLen >= KEYWORD.length) {
    showButton();
    return;
  }
  const ch = KEYWORD[typedLen];
  const pause = ch === ' ' ? 180 : 55 + Math.random() * 55;
  delay(() => {
    typedLen++;
    searchText.textContent = KEYWORD.slice(0, typedLen);
    startTyping();
  }, pause);
}

function showButton() {
  delay(() => {
    searchBtn.classList.add('visible');
    phase = PHASES.BTN_APPEAR;
    delay(pressButton, 800);
  }, 400);
}

function pressButton() {
  searchBtn.classList.add('pressed');
  cursor.classList.add('hidden');
  delay(() => {
    searchBtn.classList.remove('pressed');
    showLoading();
  }, 180);
}

function showLoading() {
  loading.classList.add('show');
  delay(showResults, 1600);
}

function showResults() {
  loading.classList.remove('show');

  result.classList.add('show');
  delay(() => rankBadge.classList.add('pop'), 80);
  delay(() => resultName.classList.add('slide'), 150);
  delay(() => resultUrl.classList.add('slide'), 250);
  delay(() => resultStars.classList.add('fade'), 350);
  
  delay(() => lowerResults.classList.add('show'), 500);

  delay(() => reset(), 5000);
}

delay(() => {
  card.classList.add('visible');
  delay(reset, 500);
}, 300);
</script>
