<div id="fmhero-widget"></div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

  #fmhero-widget {
    --fm-bg: white;
    --fm-fg: #111827;
    --fm-card: rgba(255, 255, 255, .48);
    --fm-card-solid: #eef3fb;
    --fm-muted: #edf2f9;
    --fm-border: rgba(59, 130, 246, .12);
    --fm-gold: #3B2CFF;
    --fm-gold-light: #74a9ff;
    --fm-warm: #6b7280;
    --fm-shadow: 0 18px 60px rgba(15, 23, 42, .08);
    --fm-display: "Instrument Serif", serif;
    --fm-body: 'Outfit', system-ui, sans-serif;
    position: relative;
    min-height: 100svh;
    width: 100%;
    3 overflow: hidden;
    background: var(--fm-bg);
    color: var(--fm-fg);
    border-radius: 0;
    isolation: isolate;
  }

  #fmhero-widget * {
    box-sizing: border-box
  }

  #fmhero-widget .fmhero-scene {
    position: relative;
    min-height: 100svh;
    padding: 28px 20px 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden
  }

  #fmhero-widget .fmhero-center {
    position: relative;
    z-index: 5;
    width: min(100%, 1100px);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100svh - 106px);
    padding: 18px
  }

  #fmhero-widget .fmhero-stage-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative
  }
  @media (max-width: 767px) {
    .elementor-kit-7 h3 {
        font-size: 36px !important;
        line-height: 38px;
    }
}

  #fmhero-widget .fmhero-stage {
    width: 100%;
    max-width: 760px;
    opacity: 0;
    transform: translateY(16px) scale(.985);
    filter: blur(10px);
    pointer-events: none;
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center center;
    translate: -50% -50%;
    transition: opacity .8s cubic-bezier(.22, 1, .36, 1), transform .8s cubic-bezier(.22, 1, .36, 1), filter .8s cubic-bezier(.22, 1, .36, 1)
  }

  #fmhero-widget .fmhero-stage.is-active {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
    pointer-events: auto;
    position: relative;
    left: auto;
    top: auto;
    translate: none
  }

  #fmhero-widget .fmhero-bg-layer,
  #fmhero-widget .fmhero-bg-grid,
  #fmhero-widget .fmhero-float,
  #fmhero-widget .fmhero-corners,
  #fmhero-widget .fmhero-marquees {
    position: absolute;
    inset: 0;
    pointer-events: none
  }

  #fmhero-widget .fmhero-bloom,
  #fmhero-widget .fmhero-spot {
    position: absolute;
    border-radius: 999px;
    filter: blur(6px)
  }

  #fmhero-widget .fmhero-bloom.main {
    width: 920px;
    height: 920px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(59, 130, 246, .14) 0%, rgba(59, 130, 246, 0) 57%);
    animation: fmheroFloat 16s ease-in-out infinite
  }

  #fmhero-widget .fmhero-bloom.tr {
    width: 620px;
    height: 620px;
    right: -140px;
    top: -120px;
    background: radial-gradient(circle, rgba(116, 169, 255, .16) 0%, rgba(116, 169, 255, 0) 64%);
    animation: fmheroPulse 9s ease-in-out infinite
  }

  #fmhero-widget .fmhero-bloom.bl {
    width: 540px;
    height: 540px;
    left: -140px;
    bottom: -120px;
    background: radial-gradient(circle, rgba(59, 130, 246, .12) 0%, rgba(59, 130, 246, 0) 67%);
    animation: fmheroPulse 11s ease-in-out infinite reverse
  }


  #fmhero-widget .fmhero-bg-grid .line-v,
  #fmhero-widget .fmhero-bg-grid .line-h {
    position: absolute;
    background: rgba(59, 130, 246, .07)
  }

  #fmhero-widget .fmhero-bg-grid .line-v {
    top: 0;
    bottom: 0;
    width: 1px;
    transform-origin: top center;
    animation: fmheroGrowY 2.4s cubic-bezier(.22, 1, .36, 1) forwards
  }

  #fmhero-widget .fmhero-bg-grid .line-h {
    left: 0;
    right: 0;
    height: 1px;
    transform-origin: left center;
    animation: fmheroGrowX 2.4s cubic-bezier(.22, 1, .36, 1) forwards
  }

  #fmhero-widget .fmhero-bg-grid .dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(59, 130, 246, .28);
    transform: scale(0);
    animation: fmheroPop .8s ease forwards
  }

  #fmhero-widget .fmhero-particle {
    position: absolute;
    border-radius: 50%;
    background: var(--fm-gold);
    opacity: 0;
    animation: fmheroParticle linear infinite
  }

  #fmhero-widget .fmhero-side-label {
    position: absolute;
    top: 50%;
    font: 500 10px/1 var(--fm-body);
    letter-spacing: .5em;
    text-transform: uppercase;
    color: rgba(59, 130, 246, .18)
  }

  #fmhero-widget .fmhero-side-label.left {
    left: 10px;
    transform: translateY(-50%) rotate(-90deg)
  }

  #fmhero-widget .fmhero-side-label.right {
    right: 10px;
    transform: translateY(-50%) rotate(90deg)
  }

  #fmhero-widget .fmhero-corner-line {
    position: absolute;
    background: linear-gradient(to bottom, rgba(59, 130, 246, .38), rgba(59, 130, 246, 0))
  }

  #fmhero-widget .fmhero-typing.reply {
    flex-direction: row-reverse;
  }

  #fmhero-widget .fmhero-typing.reply .fmhero-avatar {
    background: var(--fm-gold);
    box-shadow: 0 4px 18px rgba(59, 130, 246, .28);
  }

  #fmhero-widget .fmhero-typing.reply .fmhero-typing-pill {
    background: var(--fm-gold);
  }

  #fmhero-widget .fmhero-typing.reply .fmhero-typing-pill i {
    background: rgba(255, 255, 255, .85);
  }

  #fmhero-widget .fmhero-corner-line.v1 {
    left: 32px;
    top: 0;
    width: 1px;
    height: 112px;
    animation: fmheroGrowY 1.5s cubic-bezier(.22, 1, .36, 1) both
  }

  #fmhero-widget .fmhero-corner-line.v2 {
    right: 32px;
    top: 0;
    width: 1px;
    height: 140px;
    animation: fmheroGrowY 1.5s .3s cubic-bezier(.22, 1, .36, 1) both
  }

  #fmhero-widget .fmhero-corner-line.h1 {
    left: 32px;
    bottom: 32px;
    height: 1px;
    width: 98px;
    text-transform: uppercase;
    font-weight: 500;
    background: linear-gradient(to right, rgba(59, 130, 246, .35), rgba(59, 130, 246, 0));
    animation: fmheroGrowX 1.5s .2s both
  }

  #fmhero-widget .fmhero-corner-line.h2 {
    right: 32px;
    bottom: 32px;
    height: 1px;
    width: 84px;
    background: linear-gradient(to left, rgba(59, 130, 246, .28), rgba(59, 130, 246, 0));
    animation: fmheroGrowX 1.5s .5s both
  }

  #fmhero-widget .fmhero-cross {
    position: absolute;
    width: 16px;
    height: 16px;
    opacity: .22
  }

  #fmhero-widget .fmhero-cross:before,
  #fmhero-widget .fmhero-cross:after {
    content: "";
    position: absolute;
    background: rgba(59, 130, 246, .6)
  }

  #fmhero-widget .fmhero-cross:before {
    left: 0;
    top: 7px;
    width: 16px;
    height: 1px
  }

  #fmhero-widget .fmhero-cross:after {
    left: 7px;
    top: 0;
    width: 1px;
    height: 16px
  }

  #fmhero-widget .fmhero-cross.tl {
    left: 24px;
    top: 24px
  }

  #fmhero-widget .fmhero-cross.tr {
    right: 24px;
    top: 24px
  }

  #fmhero-widget .fmhero-cross.bl {
    left: 24px;
    bottom: 24px
  }

  #fmhero-widget .fmhero-cross.br {
    right: 24px;
    bottom: 24px
  }

  #fmhero-widget .fmhero-marquees {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
    opacity: 1
  }

  #fmhero-widget .fmhero-marquee-row {
    position: relative;
    height: 11rem;
    overflow: hidden
  }

  #fmhero-widget .fmhero-marquee {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    font-family: var(--fm-display);
    font-size: clamp(64px, 11vw, 180px);
    line-height: 1;
    font-weight: 700;
    color: rgba(59, 130, 246, .035);
    user-select: none
  }

  #fmhero-widget .fmhero-marquee.a {
    animation: fmheroMarqueeA 34s linear infinite
  }

  #fmhero-widget .fmhero-marquee.b {
    animation: fmheroMarqueeB 39s linear infinite
  }

  #fmhero-widget .fmhero-line {
    height: 1px;
    margin-inline: auto;
    background: linear-gradient(90deg, transparent, rgba(59, 130, 246, .55), transparent);
    width: 120px;
    transform: scaleX(0);
    animation: fmheroGrowX 1.1s .2s cubic-bezier(.22, 1, .36, 1) forwards
  }

  #fmhero-widget .fmhero-mini-label {
    font: 400 12px/1.6 var(--fm-body);
    letter-spacing: .36em;
    text-transform: uppercase;
    color: var(--fm-warm)
  }

  #fmhero-widget .fmhero-display {
    font-family: var(--fm-display);
    color: var(--fm-fg);
    margin: 0;
    letter-spacing: -.03em
  }

  #fmhero-widget .fmhero-display.gold,
  #fmhero-widget .fmhero-gold {
    color: var(--fm-gold)
  }

  #fmhero-widget .fmhero-body {
    font: 300 15px/1.75 var(--fm-body);
    color: var(--fm-warm);
    margin: 0 auto
  }

  #fmhero-widget .fmhero-welcome .fmhero-rings {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: min(82vw, 450px);
    height: min(82vw, 450px);
    pointer-events: none
  }

  #fmhero-widget .fmhero-ring {
    position: absolute;
    inset: 50%;
    border-radius: 999px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(59, 130, 246, .08)
  }

  #fmhero-widget .fmhero-ring.r1 {
    width: 74%;
    height: 74%;
    animation: fmheroSpin 20s linear infinite
  }

  #fmhero-widget .fmhero-ring.r2 {
    width: 90%;
    height: 90%;
    border-style: dashed;
    border-color: rgba(59, 130, 246, .06);
    animation: fmheroSpinReverse 30s linear infinite
  }

  #fmhero-widget .fmhero-ring.r3 {
    width: 56%;
    height: 56%;
    border-color: rgba(59, 130, 246, .07);
    animation: fmheroPulse 14s ease-in-out infinite
  }


  #fmhero-widget .fmhero-icon-badge {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 22px auto;
    position: relative;
    background: linear-gradient(135deg, rgba(59, 130, 246, .14), rgba(59, 130, 246, .04));
    border: 1px solid rgba(59, 130, 246, .22);
    box-shadow: 0 0 30px rgba(59, 130, 246, .12);
    overflow: hidden
  }

  #fmhero-widget .fmhero-icon-badge:before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .46) 50%, transparent 70%);
    transform: translateX(-160%);
    animation: fmheroSweep 3.5s ease-in-out infinite
  }

  #fmhero-widget .fmhero-icon {
    position: relative;
    z-index: 1;
    font-size: 20px;
    color: var(--fm-gold)
  }

  #fmhero-widget .fmhero-charwrap {
    display: inline-block
  }

  #fmhero-widget .fmhero-char {
    display: inline-block;
    opacity: 0;
    transform: translateY(24px) rotateX(45deg);
    filter: blur(8px);
    animation: fmheroChar .55s cubic-bezier(.22, 1, .36, 1) forwards
  }

  #fmhero-widget .fmhero-title {
    font-size: clamp(46px, 8vw, 118px);
    line-height: .98;
    font-weight: 500;
    text-transform: uppercase;
  }

  #fmhero-widget .fmhero-stage-label {
    margin-bottom: 24px
  }

  #fmhero-widget .fmhero-stage-label .top {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, rgba(59, 130, 246, .16), rgba(59, 130, 246, .05));
    box-shadow: 0 0 22px rgba(59, 130, 246, .08)
  }

  #fmhero-widget .fmhero-stage-label .top span {
    font-size: 16px;
    color: var(--fm-gold)
  }

  #fmhero-widget .fmhero-stage-label p {
    margin: 0;
    font: 400 11px/1 var(--fm-body);
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--fm-warm)
  }

  #fmhero-widget .fmhero-glass {
    position: relative;
    border-radius: 26px;
    border: 1px solid rgba(59, 130, 246, .13);
    background: var(--fm-card);
    backdrop-filter: blur(16px);
    box-shadow: 0 12px 40px -12px rgba(15, 23, 42, .08), inset 0 1px 0 rgba(255, 255, 255, .28)
  }

  #fmhero-widget .fmhero-chat {
    max-width: 520px;
    margin: 0 auto
  }

  #fmhero-widget .fmhero-chatbox {
    padding: 20px
  }

  #fmhero-widget .fmhero-chathead {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(59, 130, 246, .12)
  }

  #fmhero-widget .fmhero-beacon {
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--fm-gold);
    box-shadow: 0 0 0 0 rgba(59, 130, 246, .34);
    animation: fmheroBeacon 2s infinite
  }

  #fmhero-widget .fmhero-chathead span {
    font: 500 10px/1 var(--fm-body);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--fm-warm)
  }

  #fmhero-widget .fmhero-chatlist {
    display: flex;
    flex-direction: column;
    gap: 12px
  }

  #fmhero-widget .fmhero-msg {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    opacity: 0;
    transform: translateY(24px) scale(.94);
    filter: blur(8px);
    transition: all .55s cubic-bezier(.22, 1, .36, 1)
  }

  #fmhero-widget .fmhero-msg.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0)
  }

  #fmhero-widget .fmhero-msg.reply {
    flex-direction: row-reverse
  }

  #fmhero-widget .fmhero-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 38px;
    font: 600 12px/1 var(--fm-body);
    color: #fff;
    background: #111827;
    box-shadow: 0 4px 14px rgba(17, 24, 39, .18)
  }

  #fmhero-widget .fmhero-msg.reply .fmhero-avatar {
    background: var(--fm-gold);
    box-shadow: 0 4px 18px rgba(59, 130, 246, .28)
  }

  #fmhero-widget .fmhero-bubble {
    max-width: 76%;
    padding: 14px 16px;
    border-radius: 18px;
    background: var(--fm-muted);
    text-align: left;
    box-shadow: 0 2px 10px rgba(15, 23, 42, .05)
  }

  #fmhero-widget .fmhero-msg.reply .fmhero-bubble {
    background: var(--fm-gold);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 4px 20px rgba(59, 130, 246, .16)
  }

  #fmhero-widget .fmhero-msg:not(.reply) .fmhero-bubble {
    border-bottom-left-radius: 6px
  }

  #fmhero-widget .fmhero-bubble p {
    margin: 0;
    font: 400 14px/1.55 var(--fm-body)
  }

  #fmhero-widget .fmhero-typing {
    display: none;
    align-items: flex-end;
    gap: 12px
  }

  #fmhero-widget .fmhero-typing.show {
    display: flex
  }

  #fmhero-widget .fmhero-typing-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    border-radius: 18px;
    background: var(--fm-muted)
  }

  #fmhero-widget .fmhero-typing-pill i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: block;
    background: #8692a6;
    animation: fmheroTyping .75s infinite ease-in-out
  }

  #fmhero-widget .fmhero-typing-pill i:nth-child(2) {
    animation-delay: .12s
  }

  #fmhero-widget .fmhero-typing-pill i:nth-child(3) {
    animation-delay: .24s
  }

  #fmhero-widget .fmhero-reactions {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
    opacity: 0;
    transform: translateY(10px);
    transition: all .5s ease
  }

  #fmhero-widget .fmhero-reactions.show {
    opacity: 1;
    transform: translateY(0)
  }

  #fmhero-widget .fmhero-pill {
    padding: 7px 12px;
    border-radius: 999px;
    font: 500 12px/1 var(--fm-body);
    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(59, 130, 246, .12);
    box-shadow: none
  }

  #fmhero-widget .fmhero-glow-rings {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: min(100%, 620px);
    height: min(100vw, 620px);
    pointer-events: none
  }

  #fmhero-widget .fmhero-glow-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    border: 1px solid rgba(59, 130, 246, .15);
    box-shadow: 0 0 40px rgba(59, 130, 246, .05);
    animation: fmheroGlow 4.2s infinite ease-in-out
  }

  #fmhero-widget .fmhero-first .fmhero-core {
    position: relative;
    width: min(50vw, 220px);
    height: min(50vw, 220px);
    margin: 0 auto 34px
  }

  #fmhero-widget .fmhero-first .fmhero-core-center {
    position: absolute;
    inset: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(59, 130, 246, .18), rgba(59, 130, 246, .05));
    box-shadow: 0 0 80px rgba(59, 130, 246, .16), inset 0 0 30px rgba(59, 130, 246, .06);
    overflow: hidden
  }

  #fmhero-widget .fmhero-first .fmhero-core-center:before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .42) 50%, transparent 65%);
    transform: translateX(-160%);
    animation: fmheroSweep 3.1s ease-in-out infinite
  }

  #fmhero-widget .fmhero-first .fmhero-core-center span {
    font-size: 44px;
    position: relative;
    z-index: 1;
    color: var(--fm-gold)
  }

  #fmhero-widget .fmhero-orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%)
  }

  #fmhero-widget .fmhero-orbit .node {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 28px;
    height: 28px;
    margin: -14px 0 0 -14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(59, 130, 246, .65);
    font-size: 18px;
    animation: fmheroHover 3.2s ease-in-out infinite
  }

  #fmhero-widget .fmhero-orbit-ring {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 1px dashed rgba(59, 130, 246, .09);
    animation: fmheroSpin 25s linear infinite
  }

  #fmhero-widget .fmhero-split-line {
    overflow: hidden
  }

  #fmhero-widget .fmhero-split-line h3,
  #fmhero-widget .fmhero-split-line p {
    margin: 0;
    transform: translateY(110%);
    animation: fmheroRise .85s cubic-bezier(.22, 1, .36, 1) forwards
  }

  #fmhero-widget .fmhero-split-line h3 {
    font-family: var(--fm-display);
    font-size: clamp(32px, 4.6vw, 56px);
    line-height: 1.12;
    font-weight: 500;
    text-transform: uppercase;
    color: var(--fm-fg)
  }

  #fmhero-widget .fmhero-split-line h3.gold {
    font-weight: 500;
    font-size: 100px;
    text-transform: uppercase;
    color: var(--fm-gold)
  }

  #fmhero-widget .fmhero-craft {
    max-width: 560px;
    margin: 0 auto
  }

  #fmhero-widget .fmhero-stat-list {
    display: flex;
    flex-direction: column;
    gap: 16px
  }

  #fmhero-widget .fmhero-stat {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px;
    overflow: hidden;
    text-align: left;
    opacity: 0;
    transform: translateX(-30px);
    filter: blur(8px);
    animation: fmheroStatIn .7s cubic-bezier(.22, 1, .36, 1) forwards
  }

  #fmhero-widget .fmhero-stat:nth-child(even) {
    transform: translateX(30px)
  }

  #fmhero-widget .fmhero-stat:before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(59, 130, 246, .08) 50%, transparent 65%);
    transform: translateX(-120%);
    animation: fmheroSweepOnce 1.8s ease-in-out forwards
  }

  #fmhero-widget .fmhero-stat:after {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 2px;
    border-radius: 999px;
    background: linear-gradient(to bottom, rgba(59, 130, 246, .42), rgba(59, 130, 246, .06));
    transform: scaleY(0);
    transform-origin: top center;
    animation: fmheroGrowY .6s .3s forwards
  }

  #fmhero-widget .fmhero-stat-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;

      if (audioReady) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        audioReady = true;
      } catch (e) {
        audioReady = false;
      }

    function playMessageSound(isReply = false) {
      if (!audioReady || !audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.value = isReply ? 720 : 620;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);
    }

    ['click', 'touchstart', 'keydown', 'scroll'].forEach(eventName => {
      window.addEventListener(eventName, initAudio, { once: true, passive: true });
    });

              <span class="fmhero-word gold" style="animation-delay:1.6s">improve your image.</span>
            </div>
            <div class="fmhero-glass fmhero-location" style="opacity:0;animation:fmheroBadge .6s 2.2s forwards">
              <span class="fmhero-beacon"></span><span class="pin">📍</span><strong>Dzielna 72, Warsaw</strong>
            </div>
            <div class="fmhero-badge-row">${badges}</div>

          <div class="fmhero-stage fmhero-promise" data-stage="promise">
            <div class="fmhero-glow-rings">
              <div class="fmhero-glow-ring" style="width:300px;height:300px;animation-delay:0s"></div>
              <div class="fmhero-glow-ring" style="width:420px;height:420px;animation-delay:1.5s"></div>
            </div>
            <div class="fmhero-icon-badge"><span class="fmhero-icon">♛</span></div>
            <p class="fmhero-mini-label" style="margin:0 0 20px">Our promise</p>
            <div class="fmhero-promise-lines">
              <div class="fmhero-split-line"><h2 style="animation-delay:.6s">Walk in sharp.</h2></div>
              <div class="fmhero-split-line"><h2 class="gold" style="animation-delay:1s">Walk out sharper.</h2></div>
            </div>
            <p class="fmhero-body" style="max-width:430px;opacity:0;animation:fmheroWord .7s 1.6s forwards">We help you stand out from the crowd — with craft, care, and a vibe that keeps you coming back.</p>
            <div class="fmhero-glass fmhero-rating">
              <div class="fmhero-stars">
                <span class="fmhero-star" style="animation-delay:2.1s">★</span>
                <span class="fmhero-star" style="animation-delay:2.2s">★</span>
                <span class="fmhero-star" style="animation-delay:2.3s">★</span>
                <span class="fmhero-star" style="animation-delay:2.4s">★</span>
                <span class="fmhero-star" style="animation-delay:2.5s">★</span>
              </div>
              <span class="fmhero-score" style="opacity:0;animation:fmheroBadge .4s 2.7s forwards">5.0</span>
            </div>
            <div class="fmhero-meta" style="opacity:0;animation:fmheroBadge .6s 3s forwards">
              <div class="fmhero-meta-item"><b>🕒</b><span>Mon – Sat</span></div>
              <div class="fmhero-meta-item"><b>📍</b><span>Dzielna 72</span></div>

        </div>

      <div class="fmhero-progress">
        ${stageOrder.map((s, i) => `<button class="fmhero-dot ${i === 0 ? 'active' : ''}" type="button" data-goto="${s}" aria-label="Show ${s} stage"></button>`).join('')}

    const stageEls = Array.from(root.querySelectorAll('.fmhero-stage'));
    const dots = Array.from(root.querySelectorAll('.fmhero-dot'));
    const chatList = root.querySelector('.fmhero-chatlist');
    const typing = root.querySelector('.fmhero-typing');
    const reactions = root.querySelector('.fmhero-reactions');
    let activeStage = 'welcome';
    let stageTimer = null;
    let chatTimers = [];
    let hasCounted = false;
    let rafId = null;

    function clearTimers() {
      if (stageTimer) clearTimeout(stageTimer);
      chatTimers.forEach(t => clearTimeout(t));
      chatTimers = [];
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }

    function resetChat() {
      if (chatList) chatList.innerHTML = '';
      if (typing) typing.classList.remove('show');
      if (reactions) reactions.classList.remove('show');
    }

    function showChatSequence() {
      resetChat();
      let totalDelay = 0;

      chatMessages.forEach((msg, idx) => {
        const showTypingDelay = totalDelay;
        const showMsgDelay = totalDelay + 800;

        chatTimers.push(setTimeout(() => {
          if (typing) {
            const typingAvatar = typing.querySelector('.fmhero-avatar');
            if (typingAvatar) typingAvatar.textContent = msg.avatar;

            typing.classList.toggle('reply', !!msg.reply);
            typing.classList.add('show');
          }
        }, showTypingDelay));

        chatTimers.push(setTimeout(() => {
          typing && typing.classList.remove('show', 'reply');
          if (chatList) {
            const item = document.createElement('div');
            item.className = 'fmhero-msg' + (msg.reply ? ' reply' : '');
            item.innerHTML = `<div class="fmhero-avatar">${msg.avatar}</div><div class="fmhero-bubble"><p>${msg.text}</p></div>`;
            chatList.appendChild(item);
            requestAnimationFrame(() => item.classList.add('show'));
            playMessageSound(!!msg.reply);
          }

          if (idx === chatMessages.length - 1) {
            chatTimers.push(setTimeout(() => reactions && reactions.classList.add('show'), 1200));
          }
        }, showMsgDelay));

        totalDelay += idx === 0 ? 1400 : idx === 1 ? 1600 : idx === 2 ? 1800 : 1800;
      });
    }

    function animateCount(el, target, suffix = '') {
      const duration = 1800;
      const start = performance.now();
      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        el.textContent = Math.floor(eased * target).toLocaleString() + suffix;
        if (progress < 1) { rafId = requestAnimationFrame(step); }
      }
      rafId = requestAnimationFrame(step);
    }

    function triggerCraftCounters() {
      const stage = root.querySelector('[data-stage="craft"]');
      if (!stage) return;
      const nums = stage.querySelectorAll('[data-count]');
      nums.forEach((el, i) => {
        setTimeout(() => animateCount(el, Number(el.dataset.count || 0), el.dataset.suffix || ''), i * 170);
      });
    }

   function setStage(name, manual = false) {
  clearTimers();
  activeStage = name;
  stageEls.forEach(el => el.classList.toggle('is-active', el.dataset.stage === name));
  dots.forEach(dot => dot.classList.toggle('active', dot.dataset.goto === name));
  resetChat();

  if (name === 'chat') showChatSequence();
  if (name === 'craft') triggerCraftCounters();

  const timing = timings[name];
  if (timing) {
    stageTimer = setTimeout(() => {
      const currentIndex = stageOrder.indexOf(name);
      const nextIndex = (currentIndex + 1) % stageOrder.length;
      const next = stageOrder[nextIndex];
      setStage(next);
    }, timing);
  }
}

    dots.forEach(dot => {
      dot.addEventListener('click', () => setStage(dot.dataset.goto, true));
    });

    const onMove = (e) => {
      const x = (e.clientX / window.innerWidth - .5) * 10;
      const y = (e.clientY / window.innerHeight - .5) * 10;
      const bg = root.querySelector('.fmhero-bg-layer');
      const center = root.querySelector('.fmhero-center');
      if (bg) bg.style.transform = `translate(${x}px, ${y}px)`;
      if (center) center.style.transform = `translate(${-x * .32}px, ${-y * .32}px)`;
    };
    window.addEventListener('mousemove', onMove, { passive: true });

    let hasStartedSequence = false;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !hasStartedSequence) {
          hasStartedSequence = true;
          setStage('welcome');
          observer.unobserve(root);
        }
      });
    }, {
      threshold: 0.45
    });

    observer.observe(root);
  })();
</script>
